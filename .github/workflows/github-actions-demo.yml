name: Java CI and EC2 CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Test and build executable JAR
        run: bash ./gradlew clean build --no-daemon

      - name: Deploy to EC2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          ssh_options=(-i "$ssh_dir/key" -o BatchMode=yes -o ConnectTimeout=15
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)

          mapfile -t jars < <(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar')
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo '::error::Expected exactly one executable JAR'
            exit 1
          fi

          # Upload separately to avoid overwriting the running JAR.
          scp "${ssh_options[@]}" "${jars[0]}" "$EC2_USER@$EC2_HOST:app.jar.next"
          ssh "${ssh_options[@]}" "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ec2-user
          test -s app.jar.next
          sudo -n systemctl stop java-ci-test
          mv -f app.jar.next app.jar
          sudo -n systemctl start java-ci-test

          for attempt in {1..30}; do
            if systemctl is-active --quiet java-ci-test &&
               response=$(curl --fail --silent --max-time 3 http://localhost:8080/) &&
               [[ "$response" == 'Hello' ]]; then
              echo 'Deployment succeeded: GET / returned Hello'
              exit 0
            fi
            sleep 2
          done
          echo 'Deployment health check failed'
          sudo -n journalctl -u java-ci-test -n 50 --no-pager
          exit 1
          REMOTE
